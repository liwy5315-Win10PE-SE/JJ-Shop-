<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>魚蝦蟹金錢葫蘆雞</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3em;  
    }

    .message {
      position: absolute;
      left: 180px;
      top: 50%;
      transform: translateY(-50%);
      font-family: "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
      font-size: 24px;
      color: #333;
      animation: messageFloat 1.5s ease-in-out infinite,
                 messageColor 6s linear infinite;
    }

    @keyframes messageFloat {
      0%, 100% {
        transform: translateY(-60%);
      }
      50% {
        transform: translateY(-40%);
      }
    }

    @keyframes messageColor {
      0%, 100% {
        color: #d4373d;
      }
      33.33% {
        color: #0066cc;
      }
      66.66% {
        color: #009933;
      }
    }

    .forecast {
      position: absolute;
      right: 120px;
      top: 50%;
      transform: translateY(-50%);
      font-family: "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
      padding: 20px;
      border-radius: 10px;
    }

    .forecast-title {
      font-size: 24px;
      color: #d4373d;
      margin-bottom: 15px;
      text-align: center;
    }

    .forecast-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .forecast-option {
      padding: 8px 16px;
      border: 2px solid #d4373d;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }

    .forecast-option.active {
      background-color: #d4373d;
      color: white;
    }

    .forecast-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }

    .forecast-item {
      font-size: 20px;
      padding: 8px;
      border-radius: 5px;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .dice-container {
      display: flex;
      gap: 2rem;
      margin: 2rem 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dice {
      width: 120px;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s;
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #333;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      color: #d4373d;
    }

    .face svg {
      width: 90%;
      height: 90%;
    }

    .front  { transform: translateZ(60px); }
    .back   { transform: rotateX(-180deg) translateZ(60px); }
    .right  { transform: rotateY(90deg) translateZ(60px); }
    .left   { transform: rotateY(-90deg) translateZ(60px); }
    .top    { transform: rotateX(90deg) translateZ(60px); }
    .bottom { transform: rotateX(-90deg) translateZ(60px); }

    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      background: #d4373d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #b32d32;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .rolling {
      animation: roll 1s;
    }

    @keyframes roll {
      0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
      100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(720deg); }
    }

    .continuous-rolling {
      animation: roll 2s linear infinite;
      animation-delay: 0s;
    }

    .symbol-text {
      font-size: 64px;
      fill: currentColor;
      font-family: "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .symbol-text.two-chars {
      font-size: 48px;
    }

    .english-text {
      font-size: 16px;
      fill: currentColor;
      font-family: Arial, sans-serif;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .blue-text {
      color: #0066cc;
    }

    .green-text {
      color: #009933;
    }

    .forecast-item[data-symbol='金錢'],
    .forecast-item[data-symbol='葫蘆'] {
      color: #d4373d;
    }

    .forecast-item[data-symbol='魚'],
    .forecast-item[data-symbol='雞'] {
      color: #0066cc;
    }

    .forecast-item[data-symbol='蝦'],
    .forecast-item[data-symbol='蟹'] {
      color: #009933;
    }
    
    .dancing-girl-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .dancing-girl {
      position: static;
      width: 104px;
      height: 104px;
    }

    .dancer {
      animation: dance 1.5s infinite alternate;
    }

    @keyframes dance {
      0% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
      100% { transform: rotate(-10deg); }
    }

    .forecast-generate-btn {
      display: block;
      margin: 15px auto;
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .forecast-generate-btn:hover {
      background-color: #004499;
    }

    .forecast-generate-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  

    /* Android / mobile responsive layout fix */
    :root {
      --dice-size: clamp(92px, 25vw, 126px);
      --dice-half: calc(var(--dice-size) / 2);
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100dvh;
      padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
    }

    .container {
      width: min(100%, 720px);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      transform-origin: center center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 7vw, 3rem);
      line-height: 1.15;
      white-space: nowrap;
    }

    .dice-container {
      gap: clamp(1rem, 5vw, 2rem);
      margin: 0.7rem 0;
      width: 100%;
    }

    .dice {
      width: var(--dice-size);
      height: var(--dice-size);
    }

    .front  { transform: translateZ(var(--dice-half)); }
    .back   { transform: rotateX(-180deg) translateZ(var(--dice-half)); }
    .right  { transform: rotateY(90deg) translateZ(var(--dice-half)); }
    .left   { transform: rotateY(-90deg) translateZ(var(--dice-half)); }
    .top    { transform: rotateX(90deg) translateZ(var(--dice-half)); }
    .bottom { transform: rotateX(-90deg) translateZ(var(--dice-half)); }

    .symbol-text { font-size: clamp(48px, 15vw, 64px); }
    .symbol-text.two-chars { font-size: clamp(38px, 12vw, 48px); }
    .english-text { font-size: clamp(13px, 3.5vw, 16px); }

    .message,
    .forecast {
      z-index: 3;
    }

    .dancing-girl-container {
      flex-wrap: nowrap;
      gap: clamp(0.7rem, 4vw, 1.2rem);
      width: 100%;
    }

    .dancing-girl-container button {
      min-width: 0;
      padding: 0.85rem clamp(1rem, 4vw, 2rem);
      font-size: clamp(1rem, 4vw, 1.2rem);
      white-space: nowrap;
    }

    .dancing-girl {
      width: 42px;
      height: 42px;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    @media (max-width: 760px) {
      body {
        align-items: center;
        overflow: hidden;
      }

      .container {
        transform: scale(1.18);
        padding-top: 0;
      }

      .message {
        left: 12px;
        top: calc(50% - 88px);
        transform: none;
        font-size: clamp(13px, 3.8vw, 18px);
        white-space: nowrap;
        max-width: 38vw;

      .forecast-generate-btn {
        margin: 8px auto;
        padding: 8px 10px;
        font-size: 12px;
        max-width: 100%;
      }

      .forecast-items {
        min-height: 70px;
        gap: 5px;
      }

      .forecast-item {
        font-size: 13px;
        padding: 4px;
        white-space: nowrap;
      }
    }

    @media (max-width: 420px) {
      :root {
        --dice-size: clamp(86px, 26vw, 102px);

      .container {
        transform: scale(1.25);
      }

      .dice-container {
        gap: 1rem;
      }

      .message {
        top: calc(50% - 83px);
        left: 8px;

      }

      .forecast {
        top: calc(50% - 118px);
        right: 8px;
        width: 35vw;
      }
    }

    @media (max-width: 360px) {
      .container {
        transform: scale(1.12);
      }
      .dice-container { gap: 0.75rem; }
      .dancing-girl-container button { padding-left: 0.75rem; padding-right: 0.75rem; }
    }

<body>
  <div class="container">
    <h1>魚蝦蟹金錢葫蘆雞</h1>
    <div class="dice-container">
      <div class="dice" id="dice1">
        <div class="face front">
          <svg viewBox="0 0 100 100">
            <text x="50" y="45" text-anchor="middle" class="symbol-text two-chars">金錢</text>
            <text x="50" y="80" text-anchor="middle" class="english-text">Gold Coin</text>
          </svg>
        </div>
        <div class="face back">
          <svg viewBox="0 0 100 100">
            <text x="50" y="45" text-anchor="middle" class="symbol-text two-chars">葫蘆</text>

    <div class="forecast-controls">
      <div class="forecast-option" data-items="1">1 項</div>
      <div class="forecast-option active" data-items="2">2 項</div>
      <div class="forecast-option" data-items="3">3 項</div>
    </div>
    <button id="generateForecastBtn" class="forecast-generate-btn">生成預測</button>
    <div class="forecast-items"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rollButton = document.getElementById('rollButton');
      const stopButton = document.getElementById('stopButton');
      const generateForecastBtn = document.getElementById('generateForecastBtn');
      const dices = Array.from(document.querySelectorAll('.dice'));
      const forecastItems = document.querySelector('.forecast-items');
      const forecastOptions = document.querySelectorAll('.forecast-option');
      let isRolling = false;
      let selectedForecastItems = 2; // Default to 2 items

      const symbols = ['魚', '蝦', '蟹', '金錢', '葫蘆', '雞'];
      const symbolsEnglish = {
        '魚': 'Carp',
        '蝦': 'Lobster',
        '蟹': 'Crab',
        '金錢': 'Gold Coin',
        '葫蘆': 'Gourd',
        '雞': 'Rooster'
      };

      // Forecast option selection
      forecastOptions.forEach(option => {
        option.addEventListener('click', () => {
          forecastOptions.forEach(opt => opt.classList.remove('active'));
          option.classList.add('active');
          selectedForecastItems = parseInt(option.dataset.items);
          
          // Reset forecast items and disable generate button if no dice rolled
          if (!isRolling) {
            forecastItems.innerHTML = '';
            generateForecastBtn.disabled = true;
          }
        });
      });

      const transforms = [
        'rotateX(0) rotateY(0)',      // front - 金錢
        'rotateX(-180deg)',           // back - 葫蘆
        'rotateY(90deg)',             // right - 雞
        'rotateY(-90deg)',            // left - 魚
        'rotateX(90deg)',             // top - 蝦
        'rotateX(-90deg)'             // bottom - 蟹
      ];

      function getRandomTransform() {
        return transforms[Math.floor(Math.random() * transforms.length)];
      }

      function generateForecast() {
        forecastItems.innerHTML = '';
        
        const actualResults = dices.map(() => {
          return symbols[Math.floor(Math.random() * symbols.length)];
        });
        
        const forecast = [];
        const random = Math.random();
        
        if (random < 0.10) {
          const randomActualResult = actualResults[Math.floor(Math.random() * actualResults.length)];
          const randomPosition = Math.floor(Math.random() * selectedForecastItems);
          
          for (let i = 0; i < selectedForecastItems; i++) {
            if (i === randomPosition) {
              forecast.push(randomActualResult);
            } else {
              let availableSymbols = symbols.filter(s => !actualResults.includes(s));
              forecast.push(availableSymbols[Math.floor(Math.random() * availableSymbols.length)]);
            }
          }
        } else {
          for (let i = 0; i < selectedForecastItems; i++) {
            let availableSymbols = symbols.filter(s => !actualResults.includes(s));
            forecast.push(availableSymbols[Math.floor(Math.random() * availableSymbols.length)]);
          }
        }

        forecast.forEach((symbol, index) => {
          setTimeout(() => {
            const div = document.createElement('div');
            div.className = 'forecast-item';
            div.setAttribute('data-symbol', symbol); 
            div.textContent = `${symbol} ${symbolsEnglish[symbol]}`;
            forecastItems.appendChild(div);
          }, index * 200);
        });

        generateForecastBtn.disabled = true;
      }

      function startRolling() {
        isRolling = true;
        rollButton.disabled = true;
        stopButton.disabled = false;
        generateForecastBtn.disabled = false;

        // Clear previous forecast results
        forecastItems.innerHTML = '';

        dices.forEach((dice, index) => {
          setTimeout(() => {
            dice.classList.add('continuous-rolling');
          }, index * 300);
        });
      }

      function stopRolling() {
        isRolling = false;
        rollButton.disabled = false;
        stopButton.disabled = true;

        dices.forEach((dice, index) => {
          setTimeout(() => {
            dice.classList.remove('continuous-rolling');
            dice.style.transform = getRandomTransform();
          }, index * 300);
        });
      }

      // Bind generate forecast button
      generateForecastBtn.addEventListener('click', generateForecast);
      generateForecastBtn.disabled = true; // Initially disabled

      rollButton.addEventListener('click', startRolling);
      stopButton.addEventListener('click', stopRolling);
    });
  </script>
